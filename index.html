<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott & Judy — 50 Years</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f5efe6;
  --warm: #e8d5b7;
  --gold: #c9a96e;
  --deep: #2c1810;
  --rust: #8b4a2f;
  --sage: #6b7c6b;
  --text: #3a2a1e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--text);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
}

/* GRAIN OVERLAY */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 999;
  opacity: 0.4;
}

/* HERO */
.hero {
  position: relative;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-photos {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.hero-photo {
  overflow: hidden;
  position: relative;
}

.hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  filter: sepia(30%) saturate(80%) brightness(0.85);
  transform: scale(1.05);
  transition: transform 8s ease;
}

.hero-photo:first-child img { object-position: center 20%; }
.hero-photo:last-child img { object-position: center 15%; }

.hero:hover .hero-photo img { transform: scale(1.0); }

.hero-photo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(44,24,16,0.2) 0%, rgba(44,24,16,0.5) 100%);
}

.hero-divider {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(245,239,230,0.3);
  z-index: 2;
}

.hero-content {
  position: relative;
  z-index: 3;
  text-align: center;
  color: var(--cream);
  padding: 20px;
}

.hero-year {
  font-family: 'Jost', sans-serif;
  font-weight: 200;
  font-size: clamp(11px, 2vw, 13px);
  letter-spacing: 6px;
  text-transform: uppercase;
  opacity: 0.75;
  margin-bottom: 20px;
  animation: fadeUp 1.2s ease forwards;
  animation-delay: 0.2s;
  opacity: 0;
}

.hero-names {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(52px, 10vw, 96px);
  line-height: 0.9;
  letter-spacing: -1px;
  margin-bottom: 24px;
  animation: fadeUp 1.2s ease forwards;
  animation-delay: 0.5s;
  opacity: 0;
}

.hero-names em {
  font-style: italic;
  color: var(--warm);
}

.hero-sub {
  font-family: 'Jost', sans-serif;
  font-weight: 200;
  font-size: clamp(13px, 2.5vw, 16px);
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.7;
  animation: fadeUp 1.2s ease forwards;
  animation-delay: 0.8s;
  opacity: 0;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  animation: fadeUp 1.2s ease forwards;
  animation-delay: 1.2s;
  opacity: 0;
}

.scroll-hint span {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(245,239,230,0.5);
  font-family: 'Jost', sans-serif;
  font-weight: 200;
}

.scroll-line {
  width: 1px;
  height: 40px;
  background: linear-gradient(to bottom, rgba(245,239,230,0.5), transparent);
  animation: scrollPulse 2s ease infinite;
}

@keyframes scrollPulse {
  0%, 100% { opacity: 0.3; transform: scaleY(1); }
  50% { opacity: 0.8; transform: scaleY(1.1); }
}

/* INTRO SECTION */
.intro {
  padding: 80px 20px;
  max-width: 640px;
  margin: 0 auto;
  text-align: center;
}

.intro-date {
  font-family: 'Jost', sans-serif;
  font-weight: 200;
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 28px;
}

.intro-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 300;
  line-height: 1.5;
  color: var(--deep);
  margin-bottom: 24px;
}

.intro-text em {
  font-style: italic;
  color: var(--rust);
}

.intro-body {
  font-size: 15px;
  line-height: 1.8;
  color: #6b5a4e;
  font-weight: 300;
}

/* PHOTO STRIP */
.photo-strip {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 1fr;
  gap: 3px;
  padding: 0;
  overflow: hidden;
}

.strip-photo {
  overflow: hidden;
  position: relative;
  aspect-ratio: auto;
}

.strip-photo:nth-child(1) { aspect-ratio: 4/5; }
.strip-photo:nth-child(2) { aspect-ratio: 3/4; }
.strip-photo:nth-child(3) { aspect-ratio: 4/5; }

.strip-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: sepia(20%) saturate(85%) brightness(0.9);
  transition: transform 0.6s ease, filter 0.6s ease;
}

.strip-photo:hover img {
  transform: scale(1.04);
  filter: sepia(10%) saturate(100%) brightness(0.95);
}

/* MAIN PORTRAIT */
.portrait-section {
  padding: 80px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  background: var(--deep);
  position: relative;
  overflow: hidden;
}

.portrait-section::before {
  content: '50';
  position: absolute;
  font-family: 'Cormorant Garamond', serif;
  font-size: 280px;
  font-weight: 300;
  color: rgba(255,255,255,0.03);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  pointer-events: none;
  letter-spacing: -10px;
}

.portrait-frame {
  position: relative;
  width: min(340px, 85vw);
}

.portrait-frame::before {
  content: '';
  position: absolute;
  inset: -8px;
  border: 1px solid rgba(201,169,110,0.3);
  z-index: 0;
}

.portrait-frame::after {
  content: '';
  position: absolute;
  inset: -16px;
  border: 1px solid rgba(201,169,110,0.15);
  z-index: 0;
}

.portrait-frame img {
  width: 100%;
  display: block;
  position: relative;
  z-index: 1;
  filter: sepia(15%) saturate(90%);
}

.portrait-label {
  text-align: center;
  color: var(--warm);
}

.portrait-label .names {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 300;
  font-style: italic;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.portrait-label .year-range {
  font-family: 'Jost', sans-serif;
  font-weight: 200;
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--gold);
}

/* CTA SECTION */
.cta-section {
  padding: 80px 20px 60px;
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}

.cta-eyebrow {
  font-family: 'Jost', sans-serif;
  font-weight: 200;
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 24px;
}

.cta-heading {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(28px, 6vw, 44px);
  font-weight: 300;
  line-height: 1.2;
  color: var(--deep);
  margin-bottom: 20px;
}

.cta-heading em { font-style: italic; color: var(--rust); }

.cta-body {
  font-size: 15px;
  line-height: 1.8;
  color: #6b5a4e;
  margin-bottom: 40px;
  font-weight: 300;
}

.upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: var(--deep);
  color: var(--cream);
  padding: 18px 44px;
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.upload-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--rust);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
}

.upload-btn:hover::before { transform: translateX(0); }
.upload-btn span { position: relative; z-index: 1; }

.upload-btn-arrow {
  position: relative;
  z-index: 1;
  font-size: 18px;
  transition: transform 0.3s ease;
}

.upload-btn:hover .upload-btn-arrow { transform: translateX(4px); }

/* TIPS */
.tips {
  background: var(--warm);
  padding: 50px 20px;
}

.tips-inner {
  max-width: 600px;
  margin: 0 auto;
}

.tips-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  font-style: italic;
  color: var(--deep);
  margin-bottom: 28px;
  text-align: center;
}

.tips-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.tip {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.tip-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 300;
  color: var(--gold);
  line-height: 1;
  flex-shrink: 0;
  width: 28px;
}

.tip-text {
  font-size: 13px;
  line-height: 1.7;
  color: var(--deep);
  padding-top: 6px;
  font-weight: 300;
}

.tip-text strong {
  display: block;
  font-weight: 400;
  margin-bottom: 3px;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* LANG TABS */
.lang-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 12px 20px;
  background: rgba(44,24,16,0.85);
  backdrop-filter: blur(8px);
}

.lang-btn {
  background: transparent;
  border: none;
  color: rgba(245,239,230,0.5);
  font-family: 'Jost', sans-serif;
  font-weight: 200;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 6px 16px;
  cursor: pointer;
  transition: color 0.2s;
  border-right: 1px solid rgba(245,239,230,0.15);
}

.lang-btn:last-child { border-right: none; }
.lang-btn.active { color: var(--gold); }
.lang-btn:hover { color: var(--cream); }

/* FOOTER */
footer {
  padding: 32px 20px;
  text-align: center;
  background: var(--deep);
  color: rgba(245,239,230,0.3);
  font-size: 11px;
  letter-spacing: 2px;
  font-family: 'Jost', sans-serif;
  font-weight: 200;
  text-transform: uppercase;
}

/* MOBILE */
@media (max-width: 600px) {
  .tips-grid { grid-template-columns: 1fr; }
  .photo-strip { grid-template-columns: 1fr 1fr; }
  .strip-photo:nth-child(3) { display: none; }
  .hero-names { font-size: 48px; }
}
</style>
</head>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('fr')">FR</button>

</div>
